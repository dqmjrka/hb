name: Build HackBot IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          xcodebuild clean build \
            -project HackBot.xcodeproj \
            -scheme HackBot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES
            
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HackBot.app Payload/
          zip -r -9 HackBot.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackBot-iOS-IPA
          path: HackBot.ipa
