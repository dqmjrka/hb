name: Build HackBot IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Build iOS Application
        run: |
          xcodebuild clean build \
            -project HackBot.xcodeproj \
            -target HackBot \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Package HackBot.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "HackBot.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -9 HackBot.ipa Payload
          ls -lh HackBot.ipa

      - name: Upload HackBot.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackBot-iOS-IPA
          path: HackBot.ipa
          retention-days: 14
