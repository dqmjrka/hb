name: Build HackBot IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Build iOS Application (Release)
        run: |
          xcodebuild clean build \
            -project HackBot.xcodeproj \
            -scheme HackBot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package HackBot.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HackBot.app Payload/
          zip -r -9 HackBot.ipa Payload
          ls -lh HackBot.ipa

      - name: Upload HackBot.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackBot-iOS-IPA
          path: HackBot.ipa
          retention-days: 14
