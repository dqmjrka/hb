<!DOCTYPE html>
html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подарок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #17212b;
            color: white;
            font-family: sans-serif;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #2ea6ff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="giftBtn" onclick="sendGift()">Открыть отправку подарка</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function sendGift() {
            // Открываем профиль с подарком
            tg.openTelegramLink("tg://resolve?domain=yxo42");
        }

        // Автоматическая попытка при открытии
        try {
            sendGift();
        } catch (e) {
            console.error(e);
        }
    </script>
</body>
</html>
