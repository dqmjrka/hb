<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Gift</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: transparent;">
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Открываем окно отправки подарка пользователю @yxo42
        tg.openTelegramLink("tg://gift?username=yxo42");

        // Закрываем шторку Mini App
        setTimeout(() => {
            tg.close();
        }, 100);
    </script>
</body>
</html>
